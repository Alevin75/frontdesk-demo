<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front desk — demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202b; --muted:#6b7683; --bg:#eef1f6; --card:#fff;
  --line:#e1e7ee; --line2:#eef1f6;
  --side:#0e2a22; --side2:#123a2f; --side-ink:#cfe3da;
  --green:#12b886; --green-d:#0e8f6b; --amber:#e8833a; --red:#e0503c; --blue:#3b82f6;
  --sh:0 1px 2px rgba(16,32,48,.06), 0 8px 24px rgba(16,32,48,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Inter","Segoe UI",system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
.app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.side{width:250px;background:var(--side);color:var(--side-ink);flex:0 0 auto;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--green),var(--green-d));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}
.brand b{color:#fff;font-size:14.5px;font-weight:700;letter-spacing:.01em;display:block}
.brand span{font-size:10.5px;color:#8fb3a6;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.prop{margin:14px 14px 8px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.prop span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8fb3a6;font-weight:700}
.prop b{color:#fff;font-weight:600;font-size:14px}
nav{padding:4px 10px 20px}
.sect{margin-top:14px}
.sect>.st{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#6f9187;font-weight:700;padding:6px 12px 4px}
nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--side-ink);
  font:inherit;font-weight:500;font-size:13px;padding:8px 12px;border-radius:9px;cursor:pointer;text-align:left}
nav button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
nav button:hover{background:rgba(255,255,255,.06)}
nav button.on{background:var(--green);color:#fff;font-weight:600}
nav button .badge{margin-left:auto;background:#fff;color:var(--green-d);font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.side .foot{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7f9f95;line-height:1.5}
/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:10}
.topbar h1{font-size:17px;font-weight:700;margin:0}
.topbar .sub{font-size:12px;color:var(--muted);font-weight:500}
.topbar .demo{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{background:#fff4e6;color:#a85b12;border:1px solid #f2d3ad;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 9px;border-radius:999px;white-space:nowrap}
.chip.g{background:#e7f7f0;color:#0e8f6b;border-color:#bfe8d8}
.chip.b{background:#eaf1fe;color:#2f6bd6;border-color:#cfe0fb}
.view{padding:22px;display:none}
.view.on{display:block}
.grid{display:grid;gap:16px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.two{grid-template-columns:1.4fr 1fr}
.twoe{grid-template-columns:1fr 1fr}
@media(max-width:1080px){.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.twoe{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
.card .hd{padding:13px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .hd h3{margin:0;font-size:13.5px;font-weight:700}
.card .hd .m{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.card .bd{padding:14px 16px}
.kpi{padding:16px}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;min-height:29px}
.kpi .val{font-size:25px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .up{color:var(--green-d);font-weight:700}
.kpi .dn{color:var(--red);font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.pill.ok{background:#e7f7f0;color:#0e8f6b}
.pill.check{background:#fdece7;color:#c0452f}
.pill.in{background:#eaf1fe;color:#2f6bd6}
.pill.warn{background:#fff4e6;color:#a85b12}
.avatar{width:30px;height:30px;border-radius:50%;background:#dfe7ee;color:#41505f;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 auto}
.gname{display:flex;align-items:center;gap:9px}
.gname b{font-weight:600}
.gname .txt{min-width:0}
.gname .txt>span{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.bar{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--green-d))}
/* charts */
.bars{display:flex;align-items:flex-end;gap:10px;height:190px;padding-top:8px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bars .cl{font-size:10.5px;color:var(--muted);font-weight:600}
.bars .cv{font-size:10.5px;color:var(--ink);font-weight:700}
.bars .cb{width:100%;max-width:44px;background:linear-gradient(180deg,var(--green),var(--green-d));border-radius:7px 7px 0 0;min-height:4px}
.pie{display:flex;align-items:center;gap:18px}
.pie .donut{width:150px;height:150px;border-radius:50%;flex:0 0 auto}
.legend{font-size:12.5px}
.legend div{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
/* chat */
.chatwrap{display:grid;grid-template-columns:290px 1fr}
@media(max-width:900px){.chatwrap{grid-template-columns:minmax(0,1fr)}}
.convlist{border-right:1px solid var(--line2)}
.conv{padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;gap:10px}
.conv.on{background:#f4fbf8}
.conv .t{flex:1;min-width:0}
.conv b{font-weight:600;font-size:13px;display:block}
.conv small{color:var(--muted);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:6px;flex:0 0 auto}
.thread{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:300px}
.msg{max-width:74%;padding:10px 13px;border-radius:12px;font-size:13.5px}
.msg.g{background:#f1f4f8;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:3px}
.msg.m{background:var(--green);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.msg time{display:block;font-size:11px;opacity:.75;margin-top:4px}
.composer{border-top:1px solid var(--line2);padding:12px 14px;display:flex;gap:10px}
.composer input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
/* note */
.note{background:#f2f8ff;border:1px solid #d7e6fb;border-left:4px solid var(--blue);border-radius:10px;padding:12px 14px;margin-top:16px}
.note .nh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;color:#23509b;margin-bottom:5px}
.note .nh svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.note .nb{font-size:13px;color:#33415c;line-height:1.55}
.note .nb code{background:#e3eefc;border-radius:4px;padding:1px 5px;font-size:12.5px}
.note.gr{background:#f2fbf7;border-color:#cbeadc;border-left-color:var(--green-d)}
.note.gr .nh{color:#0e8f6b}
.note.am{background:#fff8ef;border-color:#f5ddbb;border-left-color:var(--amber)}
.note.am .nh{color:#a85b12}
/* misc */
.panelhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.btn{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.btn.g{background:var(--green);color:#fff}
.btn.n{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.s{padding:6px 11px;font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--green);border-color:var(--green);color:#fff}
.field{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:13px;width:100%}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:12.5px}
.sep{height:1px;background:var(--line2);margin:14px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .cd{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px;font-size:11px;text-align:center}
.cal .cd b{display:block;font-size:12.5px}
.gridcells{display:grid;gap:3px;font-size:11.5px}
.gridcells .h{font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.gridcells .r{font-weight:600;padding:5px 6px;white-space:nowrap}
.cell{border-radius:6px;padding:5px 0;text-align:center;font-weight:600}
.cell.free{background:#eef1f6;color:#93a0ad}
.cell.busy{background:#d7f2e8;color:#0e8f6b}
.cell.dens{background:#12b886;color:#fff}

/* ================= MOBILE FIX (added 23.11.2026) ================= */
@media (max-width:820px){
  .app{flex-direction:column}
  /* сайдбар -> компактная шапка: логотип + объект, меню уходит в строку-скролл */
  .side{width:100%;position:static;height:auto;max-height:none;overflow:visible;
        display:grid;grid-template-columns:auto 1fr;align-items:center}
  .brand{padding:10px 12px 8px;border-bottom:0}
  .brand .mark{width:26px;height:26px;font-size:12.5px}
  .brand b{font-size:13.5px}
  .brand span{font-size:9.5px}
  .prop{margin:8px 12px 8px 0;padding:6px 10px}
  .prop span{font-size:9px}
  .prop b{font-size:12.5px}
  .side .foot{display:none}
  #nav{grid-column:1 / -1;display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;
       padding:2px 12px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #nav::-webkit-scrollbar{display:none}
  #nav .sect{display:flex;align-items:center;gap:7px;margin:0}
  #nav .sect>.st{display:none}
  #nav button{width:auto;white-space:nowrap;flex:0 0 auto;background:rgba(255,255,255,.07);
              border-radius:999px;padding:7px 12px;font-size:12.5px;gap:7px}
  #nav button svg{width:15px;height:15px}
  #nav button.on{background:var(--green);color:#fff}
  #nav button .badge{margin-left:0}

  .topbar{height:auto;min-height:0;padding:10px 12px;flex-wrap:wrap;gap:4px 8px}
  .topbar h1{font-size:15.5px;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .sub{font-size:11.5px;order:3;width:100%}
  .topbar .demo{margin-left:auto;flex:0 0 auto;gap:6px}
  .chip{font-size:9.5px;padding:3px 7px;letter-spacing:.03em}

  .view{padding:12px 12px 26px}
  .grid{gap:12px;min-width:0}
  .grid,.convlist,.thread,.conv{min-width:0}
  .k4,.k3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.twoe{grid-template-columns:minmax(0,1fr)}
  .card{border-radius:12px;overflow:hidden}
  .card .hd{padding:11px 12px;flex-wrap:wrap;gap:4px 10px}
  .card .hd h3{font-size:13px}
  .card .bd{padding:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .kpi{padding:12px}
  .kpi .lbl{min-height:0;font-size:10px}
  .kpi .val{font-size:21px}
  .kpi .sub{font-size:11px}

  table{min-width:560px}
  th,td{padding:9px 8px;font-size:12.5px}
  .cal{min-width:560px}
  .gridcells{min-width:600px;font-size:11px}

  .bars{height:150px;gap:5px}
  .bars .cl,.bars .cv{font-size:9.5px}
  .pie{flex-direction:column;align-items:flex-start;gap:12px}
  .pie .donut{width:132px;height:132px}

  .chatwrap{grid-template-columns:minmax(0,1fr)}
  .convlist{border-right:0;border-bottom:1px solid var(--line2);max-height:230px;overflow-y:auto}
  .thread{padding:12px;min-height:200px}
  .msg{max-width:90%;font-size:13px}
  .composer{padding:10px 12px}

  .panelhead{gap:8px;margin-bottom:12px}
  .btn{padding:8px 12px;font-size:12.5px}
  .btn.s{padding:6px 10px;font-size:11.5px}
  .note{padding:11px 12px}
  .note .nb{font-size:12.5px}
}
@media (max-width:430px){
  .k4,.k3{grid-template-columns:1fr}
  table{min-width:470px}
  .cal{min-width:470px}
  .gridcells{min-width:520px}
}
.wrap-x{overflow-x:hidden}
/* ================= /MOBILE FIX ================= */
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="mark">FD</div>
      <div><b>Front desk</b><span>Demo</span></div>
    </div>
    <div class="prop"><span>Property</span><b>Your property</b></div>
    <nav id="nav"></nav>
    <div class="foot">
      Demo panel · sample data.<br>
      Not connected to any real system.
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <h1 id="ttl">Today</h1>
      <span class="sub" id="tsub"></span>
      <div class="demo">
        <span class="chip">Demo</span>
        <span class="chip g">Sample data</span>
      </div>
    </div>
    <div id="views"></div>
  </div>
</div>
<script>
/* ============================================================
   ICONS
   ============================================================ */
function ic(n){
  var p={
   arrivals:'<path d="M4 18h16M7 18V7l5-3 5 3v11M10 12h4"/>',
   dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
   compare:'<path d="M4 20V10M10 20V4M16 20v-6M22 20H2"/>',
   detail:'<path d="M4 6h16M4 12h16M4 18h10"/>',
   guests:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 11a3 3 0 1 0 0-6M18 20a5 5 0 0 0-3-4.6"/>',
   rates:'<path d="M3 17l5-6 4 3 5-8 4 4"/><path d="M3 21h18"/>',
   breakfast:'<path d="M4 8h16M6 8V6a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v2M5 8v9a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3V8"/>',
   reports:'<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h6M9 17h6"/>',
   upcoming:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
   grid:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>',
   fishing:'<path d="M3 12c4-5 14-5 18 0-4 5-14 5-18 0z"/><circle cx="9" cy="12" r="1.5"/><path d="M15 8l4-4"/>',
   occupancy:'<path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/>',
   payroll:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.8 1.8 0 0 1 0 3.6h-4a1.8 1.8 0 0 0 0 3.6h4"/>',
   campaigns:'<path d="M3 11l16-6v14L3 13z"/><path d="M7 12.5V18a2 2 0 0 0 2 2h1v-5"/>',
   breakdowns:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/>',
   api:'<path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/>',
   chat:'<path d="M21 12a8 8 0 0 1-11.6 7.2L4 20l1-4.4A8 8 0 1 1 21 12z"/>',
   charges:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 14h6M7 17h4"/>',
   about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'
  };
  return '<svg viewBox="0 0 24 24">'+(p[n]||p.about)+'</svg>';
}

/* ============================================================
   HELPERS
   ============================================================ */
function note(t,body,kind){
  return '<div class="note '+(kind||'')+'"><div class="nh">'+ic('about')+'<span>'+t+'</span></div><div class="nb">'+body+'</div></div>';
}
function card(title,meta,body,cls){
  return '<div class="card '+(cls||'')+'"><div class="hd"><h3>'+title+'</h3>'+(meta?'<span class="m">'+meta+'</span>':'')+'</div><div class="bd">'+body+'</div></div>';
}
function kpi(lbl,val,sub){ return '<div class="card kpi"><div class="lbl">'+lbl+'</div><div class="val">'+val+'</div><div class="sub">'+(sub||'')+'</div></div>'; }
function av(name){
  var p=(name||'?').trim().split(/\s+/); var s=(p[p.length-1]||'?')[0].toUpperCase();
  return '<span class="avatar">'+s+'</span>';
}
function rows(head,data){
  function ch(c){ return (c&&c.h!==undefined)?c.h:(''+(c===undefined||c===null?'':c)); }
  function isNum(h){ var s=(''+h).trim(); return !!s && s.indexOf('<')<0 &&
      (/^€/.test(s)||/%$/.test(s)||/^\d{1,3}(,\d{3})*$/.test(s)||/^\d+$/.test(s)); }
  var t=head.map(function(x){return (x&&x.h!==undefined)?x.h:(x&&x[0]!==undefined?x[0]:'');});
  var numCol=[];
  for(var j=0;j<t.length;j++){
    var any=false,all=true;
    for(var i=0;i<data.length;i++){ var s=ch(data[i][j]); if(s==='') continue; any=true; if(!isNum(s)){all=false;break;} }
    numCol[j]=any&&all;
  }
  var h='<tr>'+head.map(function(x,j){
    var n=numCol[j] || (x&&x.n!==undefined?x.n:(x&&x[1]));
    return '<th'+(n?' class="num"':'')+'>'+t[j]+'</th>';
  }).join('')+'</tr>';
  var b=data.map(function(r){return '<tr>'+r.map(function(c,j){
    var n=numCol[j] || (c&&c.n!==undefined?c.n:0);
    return '<td'+(n?' class="num"':'')+'>'+ch(c)+'</td>';
  }).join('')+'</tr>';}).join('');
  return '<table>'+h+b+'</table>';
}
function bars(items){
  var max=Math.max.apply(null,items.map(function(i){return i[1];}));
  return '<div class="bars">'+items.map(function(i){
    return '<div class="col"><div class="cv">'+i[2]+'</div><div class="cb" style="height:'+Math.round(i[1]/max*140)+'px"></div><div class="cl">'+i[0]+'</div></div>';
  }).join('')+'</div>';
}

/* ============================================================
   SCREEN CONTENT
   ============================================================ */
var V={};

/* -------- Arrivals on date -------- */
V.arrivals=function(){
  return '<div class="panelhead">'+
    '<div class="tabs"><span class="tab on">Today</span><span class="tab">Tomorrow</span></div>'+
    '<span class="muted">Wednesday, 25 November</span>'+
    '<button class="btn n s" style="margin-left:auto">Copy list for WhatsApp</button>'+
    '<button class="btn n s">Save to Word</button>'+

/* ============================================================
   NAVIGATION
   ============================================================ */
var SEC=[
 {t:'Arrivals on date', items:[['arrivals','Arrivals','arrivals']]},
 {t:'Booking analytics', items:[
   ['dashboard','Dashboard','dashboard'],['compare','Compare','compare'],
   ['detail','Analytics detail','detail'],['guests','Guests','guests'],
   ['rates','Rates & occupancy','rates'],['breakfasts','Breakfasts','breakfast'],
   ['reports','Reports','reports'],['upcoming','Upcoming','upcoming']]},
 {t:'Tent rental + Fishing', items:[
   ['grid','Grid','grid'],['fishing','Fishing','fishing'],['occupancy','Tent occupancy','occupancy']]},
 {t:'Salaries', items:[['payroll','Payroll','payroll']]},
 {t:'Yandex.Direct', items:[
   ['campaigns','Campaigns','campaigns'],['breakdowns','Breakdowns','breakdowns'],['api','API access','api']]},
 {t:'Guests', items:[['chat','Messages','chat']]},
 {t:'Concept', items:[['charges','Charges to rooms','charges']]},
 {t:'', items:[['about','About this demo','about']]}
];
var TITLES={arrivals:'Arrivals on date',dashboard:'Dashboard',compare:'Compare periods',detail:'Analytics detail',
 guests:'Returning guests',rates:'Rates & occupancy',breakfasts:'Breakfast plan',reports:'Owner\u2019s reports',
 upcoming:'Upcoming bookings',grid:'Tent grid',fishing:'Fishing',occupancy:'Tent occupancy',payroll:'Payroll',
 campaigns:'Campaigns',breakdowns:'Breakdowns',api:'API access',chat:'Guest messages',charges:'Charges to rooms',
 about:'About this demo'};
var SUBS={arrivals:'Wednesday, 25 November 2026',payroll:'November 2026',chat:'2 new messages',
 charges:'concept',dashboard:'all time'};

function renderNav(){
  var h='';
  SEC.forEach(function(s){
    h+='<div class="sect">'+(s.t?'<div class="st">'+s.t+'</div>':'');
    s.items.forEach(function(it){
      h+='<button data-k="'+it[0]+'">'+ic(it[2])+'<span>'+it[1]+'</span>'+
         (it[0]==='chat'?'<span class="badge">2</span>':'')+'</button>';
    });
    h+='</div>';
  });
  document.getElementById('nav').innerHTML=h;
}
function renderViews(){
  var h='';
  SEC.forEach(function(s){s.items.forEach(function(it){
    h+='<div class="view" id="v-'+it[0]+'"></div>';
  });});
  document.getElementById('views').innerHTML=h;
}
function show(k){
  if(!V[k]) k='arrivals';
  document.getElementById('v-'+k).innerHTML=V[k]();
  var vs=document.querySelectorAll('.view');
  for(var i=0;i<vs.length;i++) vs[i].classList.remove('on');
  document.getElementById('v-'+k).classList.add('on');
  var bs=document.querySelectorAll('#nav button');
  for(var j=0;j<bs.length;j++) bs[j].classList.toggle('on', bs[j].getAttribute('data-k')===k);
  document.getElementById('ttl').textContent=TITLES[k]||k;
  document.getElementById('tsub').textContent=SUBS[k]||'';
  window.scrollTo(0,0);
}
function route(){ show((location.hash||'#arrivals').replace('#','')); }
renderNav(); renderViews();
window.addEventListener('hashchange',route);
document.getElementById('nav').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  location.hash=b.getAttribute('data-k');
});
route();
</script>
</body>
</html>
